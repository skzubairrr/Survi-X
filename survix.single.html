<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SurviX — Social Media Analytics & Audience Intelligence</title>
<meta name="description" content="SurviX — social media analytics & audience intelligence across sentiment, demographics, trends and network influence.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23FFFFFF'/><rect x='6' y='6' width='88' height='88' rx='14' fill='none' stroke='%23E8EBF0' stroke-width='4'/><path d='M28 60 L44 42 L56 52 L74 30' stroke='%233B5BDB' stroke-width='8' fill='none' stroke-linecap='square' stroke-linejoin='miter'/><path d='M60 28 h16 v16' stroke='%235B7FD4' stroke-width='8' fill='none' stroke-linecap='square' stroke-linejoin='miter'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SurviX — Design System (light / product-dashboard theme)
   Off-white ground · white cards · navy ink · muted-blue accent
   Inter + IBM Plex Mono · Radius 10px · 1px borders · soft shadows
   ============================================================ */

:root{
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;   /* spacing scale */
  --stroke:1.6px;                                                    /* chart line width */

  --bg0:#FAFBFD;             /* page ground — off-white */
  --bg1:#FFFFFF;             /* sidebar / topbar */
  --bg2:#F4F6FA;             /* hover fill */
  --bg3:#EDF0F5;             /* pressed fill / tracks */
  --panel:#FFFFFF;           /* cards */
  --panel2:#FDFDFE;

  --line:#E8EBF0;            /* light hairline */
  --line2:#D8DDE6;           /* stronger hairline */

  --text:#1E2A3B;            /* dark navy ink */
  --text2:#3E4C61;           /* strong secondary */
  --text3:#6B7686;           /* muted slate */

  --accent:#3B5BDB;          /* muted blue — primary accent */
  --accent-dim:rgba(59,91,219,.08);
  --accent-line:rgba(59,91,219,.35);
  --caramel:#5B7FD4;         /* secondary blue — data/charts */

  /* semantic data colors (muted) */
  --pos:#4E9A6E;             /* muted green */
  --neg:#CC5F52;             /* muted red */
  --neu:#8894A6;             /* gray-blue */
  --steel:#8894A6;           /* legacy alias */
  --clay:#7A8CD8;            /* periwinkle */
  --amber:#E09A4E;           /* muted orange */
  --violet:#8B7FD6;          /* muted purple — sentiment */
  --white:#1E2A3B;

  --radius:10px;
  --radius-sm:8px;
  --card-shadow:0 1px 3px rgba(30,42,59,.06);
  --sidebar-w:216px;
  --topbar-h:44px;

  --font:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',monospace;
  --display:'Inter',system-ui,sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg0);
  color:var(--text);
  font-size:12.5px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:rgba(59,91,219,.15)}
a{color:var(--text2);text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

b,strong{font-weight:600}

/* Scrollbars — square, dim */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D8DDE6;border-radius:0}
::-webkit-scrollbar-thumb:hover{background:#C2C9D6}
::-webkit-scrollbar-track{background:transparent}

/* ================= Layout ================= */
#app{display:flex;min-height:100vh}

.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  position:fixed;inset:0 auto 0 0;z-index:60;
  background:var(--bg1);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  transition:transform .2s ease;
}
.sidebar.hidden{transform:translateX(-100%)}

.brand{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px 11px;
  border-bottom:1px solid var(--line);
}
.brand .logo{
  width:26px;height:26px;flex:0 0 26px;
  border:1px solid var(--accent-line);background:var(--accent-dim);border-radius:8px;
  display:grid;place-items:center;
}
.brand .logo svg{width:16px;height:16px;color:var(--accent)}
.brand-name{
  font-family:var(--display);font-weight:600;font-size:17px;
  letter-spacing:1.2px;text-transform:uppercase;line-height:1;
}
.brand-name b{color:var(--accent);font-weight:600}
.brand-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:1.8px;color:var(--text3);text-transform:uppercase;margin-top:3px}

.nav{padding:10px 0;flex:1;overflow-y:auto;display:flex;flex-direction:column}
/* center the module list in the free column space (auto margins collapse safely on overflow) */
.nav > .nav-label:first-child{margin-top:auto}
.nav > .nav-item:last-child{margin-bottom:auto}
.nav-label{
  font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:1.6px;
  color:var(--text3);text-transform:uppercase;padding:12px 14px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:9px 14px;
  color:var(--text2);font-weight:500;font-size:12.5px;
  border-left:2px solid transparent;
  transition:background .1s,color .1s;
  text-align:left;
}
.nav-item svg{width:14px;height:14px;flex:0 0 14px;opacity:.8}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{
  background:var(--bg3);color:var(--text);
  border-left-color:var(--accent);
}
.nav-item.active svg{opacity:1;color:var(--accent)}
.nav-item .tag{
  margin-left:auto;font-family:var(--mono);font-size:8.5px;letter-spacing:.8px;
  padding:1px 4px;color:var(--text3);
  border:1px solid var(--line2);border-radius:var(--radius-sm);
}
.nav-item .tag.beta{color:var(--accent);border-color:var(--accent-line)}

.pipeline-mini{margin:0;border-top:1px solid var(--line);padding:12px 14px 10px;background:var(--bg1)}
.pipeline-mini h5{
  font-family:var(--font);font-size:11px;letter-spacing:.1px;
  color:var(--text2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-weight:600;
}
.pl-meter{height:3px;background:var(--bg3);border:1px solid var(--line);margin:0 0 9px;overflow:hidden}
.pl-meter i{display:block;height:100%;width:38%;background:var(--accent);opacity:.85;animation:plLoad 3.2s ease-in-out infinite}
@keyframes plLoad{0%,100%{transform:translateX(-30%)}50%{transform:translateX(230%)}}
.pl-row{display:grid;grid-template-columns:5px 62px 1fr auto;align-items:center;gap:7px;font-size:11px;color:var(--text2);padding:2.5px 0}
.pl-row .nm{color:var(--text2)}
.pl-row .lat{font-family:var(--mono);font-size:9px;color:var(--text3);text-align:right;letter-spacing:.3px}
.pl-row .st{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;min-width:52px;text-align:right}
.pl-row .st:first-child:last-child{grid-column:1 / -1;min-width:0;text-align:left}
.dot{width:5px;height:5px;border-radius:0;flex:0 0 5px;background:var(--text3)}
.dot.live{background:var(--accent);animation:blink 1.6s steps(2) infinite}
.dot.sync{background:var(--accent);opacity:.55;animation:blink .9s steps(2) infinite}
.dot.ok{background:var(--steel)}
.dot.off{background:#D8DDE6}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.sidebar-foot{
  padding:9px 14px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.6px;color:var(--text3);
  display:flex;align-items:center;gap:8px;text-transform:uppercase;
}
.sidebar-foot .avatar{
  width:20px;height:20px;border:1px solid var(--line2);
  display:grid;place-items:center;font-size:8.5px;color:var(--text2);
}
.sidebar-foot b{color:var(--text2);font-weight:500}

.main{flex:1;margin-left:var(--sidebar-w);min-width:0;display:flex;flex-direction:column}
.main.expanded{margin-left:0}

/* ================= Topbar ================= */
.topbar{
  height:var(--topbar-h);flex:0 0 var(--topbar-h);
  display:flex;align-items:center;gap:12px;
  padding:0 16px;
  border-bottom:1px solid var(--line);
  background:var(--bg1);
  position:sticky;top:0;z-index:50;
}
.hamburger{display:none;width:28px;height:28px;border:1px solid var(--line2);border-radius:var(--radius-sm);place-items:center}
.hamburger:hover{border-color:var(--text3)}
.hamburger svg{width:14px;height:14px;color:var(--text2)}
.topbar .crumb{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:-.1px}
.crumb b{color:var(--accent);font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}

.live-chip{
  display:flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--text2);
  border:1px solid var(--line2);border-radius:var(--radius-sm);
  padding:4px 9px;
}
.live-chip .dot{background:var(--accent);animation:blink 1.6s steps(2) infinite}
.live-chip .txt{color:var(--accent)}
.range{display:flex;border:1px solid var(--line2);border-radius:var(--radius-sm);overflow:hidden}
.range button{
  padding:4px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.5px;
  color:var(--text3);border-right:1px solid var(--line2);transition:background .1s;
}
.range button:last-child{border-right:none}
.range button:hover{color:var(--text2);background:var(--bg2)}
.range button:active{background:var(--bg3)}
.range button.on{background:var(--accent-dim);color:var(--accent)}
.range button:disabled{color:#A9B2C1;cursor:default}

/* ================= Page / Cards ================= */
.page{padding:16px;max-width:1560px;width:100%;margin:0 auto;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.page-head h1{
  font-family:var(--display);font-size:20px;font-weight:700;
  letter-spacing:-.2px;line-height:1.15;
}
.page-head p{color:var(--text2);margin-top:4px;max-width:680px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2px}
.page-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g23{grid-template-columns:2fr 3fr}
.g32{grid-template-columns:3fr 2fr}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px;
  box-shadow:var(--card-shadow);
  min-width:0;position:relative;
}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.card-head h3{
  font-family:var(--font);font-size:13px;font-weight:600;
  letter-spacing:-.1px;color:var(--text);
}
.card-head .sub{font-size:10.5px;color:var(--text3);font-family:var(--mono)}
.card-head .right{margin-left:auto;display:flex;gap:7px;align-items:center}
.card-head .ico{width:18px;height:18px;display:grid;place-items:center;color:var(--text3)}
.card-head .ico svg{width:13px;height:13px}

/* KPI cells — compact data blocks with pastel icon circles */
.kpi{padding:14px 16px}
.kpi .top{display:flex;align-items:center;gap:10px;color:var(--text3);font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:.1px}
.kpi .top .ico{width:14px;height:14px;display:grid;place-items:center;flex:0 0 14px}
.kpi .top .ico svg{width:12px;height:12px;color:var(--text2)}
.ico-circle{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center}
.ico-circle svg{width:17px;height:17px}
.ico-circle.green{background:#E3F2E8;color:#3E7D57}
.ico-circle.blue{background:#E5EDFB;color:#3B5BDB}
.ico-circle.purple{background:#ECE9F9;color:#6F5FC4}
.ico-circle.orange{background:#FBEDDD;color:#B06A2E}
.kpi .val{
  font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.4px;
  margin:12px 0 4px;font-variant-numeric:tabular-nums;color:var(--text);
}
/* text values (long topic names) stay proportional to numeric siblings */
.kpi.with-text-val .val{
  font-family:var(--font);font-size:17px;font-weight:700;letter-spacing:-.1px;line-height:1.3;
}
/* reserve the bottom-right sparkline zone so text never collides with it */
.kpi:has(canvas.spark){padding-right:132px}
.kpi .val small{font-size:12px;color:var(--text3);font-weight:400}
.kpi .delta{font-size:10.5px;font-weight:400;font-family:var(--mono);font-variant-numeric:tabular-nums;max-width:100%}
.up{color:var(--pos)}.down{color:var(--neg)}.flat{color:var(--text3)}
.kpi .spark{position:absolute;right:12px;bottom:12px;opacity:.9}

/* Tags & status badges — square bracket style */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:1px;
  padding:2px 6px;border-radius:var(--radius-sm);text-transform:uppercase;
  border:1px solid var(--line2);color:var(--text2);
}
.badge.connected{color:var(--pos);border-color:rgba(78,154,110,.45)}
.badge.good{color:var(--amber);border-color:rgba(197,138,74,.45)}
.badge.bonus{color:var(--text2);border-color:var(--line2)}
.badge.syncing{color:var(--accent);border-color:var(--accent-line)}
.badge .dot{margin:0}

.ptabs{display:flex;gap:6px;flex-wrap:wrap}
.ptab{
  display:flex;align-items:center;gap:7px;
  padding:5px 9px;border-radius:var(--radius);
  background:var(--bg2);border:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.4px;color:var(--text2);
  transition:border-color .1s,color .1s,background .1s;
}
.ptab:hover{border-color:var(--line2);color:var(--text);background:var(--bg3)}
.ptab:active{background:var(--accent-dim)}
.ptab.on{border-color:var(--accent-line);color:var(--text);background:var(--accent-dim)}
.ptab .plogo{width:14px;height:14px;display:grid;place-items:center}
.ptab .plogo svg{width:13px;height:13px}

/* Charts */
.chart-wrap{width:100%;position:relative}
.chart-wrap canvas{display:block;width:100%}
.chart-tip{
  position:fixed;z-index:100;pointer-events:none;
  background:var(--bg3);border:1px solid var(--line2);
  border-radius:var(--radius);padding:7px 9px;font-size:10.5px;
  opacity:0;transition:opacity .1s;max-width:250px;
  font-family:var(--mono);color:var(--text2);
}
.chart-tip b{display:block;margin-bottom:3px;font-size:10.5px;color:var(--text);font-weight:500}
.chart-tip .row{display:flex;align-items:center;gap:6px;padding:1px 0;font-size:10px}
.chart-tip .row i{width:7px;height:7px;display:inline-block}
.chart-tip .row b{margin:0;color:var(--text);font-variant-numeric:tabular-nums}

/* Sentiment feed — ledger rows */
.feed{display:flex;flex-direction:column;max-height:560px;overflow-y:auto}
.post{
  border-bottom:1px solid var(--line);
  padding:9px 4px;
}
.post:last-child{border-bottom:none}
.post:hover{background:var(--bg2)}
.post .p-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.post .pav{
  width:20px;height:20px;border-radius:var(--radius-sm);
  display:grid;place-items:center;font-size:9px;font-weight:600;color:#FFFFFF;flex:0 0 20px;
}
.post .u{font-weight:600;font-size:12px;color:var(--text)}
.post .h{color:var(--text3);font-size:10.5px;font-family:var(--mono)}
.post .plat{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--text3);font-size:10px;font-family:var(--mono)}
.post .plat svg{width:12px;height:12px}
.post .txt{color:var(--text2);font-size:12px;line-height:1.5}
.post .p-foot{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
.emo-chip{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.8px;
  padding:1.5px 6px;border-radius:var(--radius-sm);border:1px solid;text-transform:uppercase;
}
.conf{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--text3);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.conf .bar{width:52px;height:3px;background:var(--bg3);overflow:hidden;border:1px solid var(--line)}
.conf .bar i{display:block;height:100%;background:var(--accent)}

/* Scrubber */
.scrub-card{padding-bottom:12px}
.scrub-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--text2);margin-bottom:4px;font-family:var(--mono)}
.scrub-legend span{display:flex;align-items:center;gap:5px}
.scrub-legend i{width:8px;height:8px}
.event-card{
  margin-top:10px;border:1px solid var(--accent-line);
  background:var(--accent-dim);padding:12px;
  display:none;animation:fadeIn .15s ease;
}
.event-card.show{display:block}
.event-card h4{
  font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent);
  display:flex;gap:8px;align-items:center;letter-spacing:.8px;text-transform:uppercase;
}
.event-card p{font-size:11.5px;color:var(--text2);margin-top:5px}
.event-card .stats{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.event-card .stat b{font-family:var(--mono);font-size:13px;font-weight:500;display:block;font-variant-numeric:tabular-nums;color:var(--text)}
.event-card .stat span{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}

/* Event icon circle (Key Events rows) */
.evt-circle{
  width:32px;height:32px;flex:0 0 32px;border-radius:50%;
  background:#E5EDFB;color:#3B5BDB;display:grid;place-items:center;
}
.evt-circle svg{width:15px;height:15px}

/* Event tag (replaces pin emoji) */
.evt-tag{
  font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:var(--accent);
  border:1px solid var(--accent-line);padding:1px 4px;border-radius:var(--radius-sm);
  flex:0 0 auto;text-transform:uppercase;
}

/* Demographics */
.disclaimer{
  display:flex;gap:8px;align-items:flex-start;
  border:1px solid var(--accent-line);background:var(--accent-dim);
  color:var(--text2);border-radius:var(--radius);padding:8px 12px;
  font-size:11px;line-height:1.5;margin-bottom:12px;
}
.disclaimer b{color:var(--accent);font-family:var(--mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase}
.disclaimer svg{width:13px;height:13px;flex:0 0 13px;margin-top:1px;color:var(--accent)}
.region-row{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--line)}
.region-row:last-child{border:none}
.region-row .flag{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.5px;color:var(--text3);
  border:1px solid var(--line2);padding:1px 3px;border-radius:var(--radius-sm);
  width:26px;text-align:center;flex:0 0 26px;
}
.region-row .nm{font-size:11.5px;color:var(--text2);width:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region-row .track{flex:1;height:8px;background:var(--bg3);overflow:hidden;border:1px solid var(--line)}
.region-row .track i{display:block;height:100%;background:var(--text2);transition:width .6s ease}
.region-row:first-of-type .track i{background:var(--accent)}
.region-row .pct{font-family:var(--mono);font-size:10.5px;color:var(--text2);width:46px;text-align:right;font-variant-numeric:tabular-nums}
.tagcloud{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:center;justify-content:center;padding:6px 2px}
.tagcloud .w{transition:color .1s;cursor:default;padding:1px 3px}
.tagcloud .w:hover{color:var(--text)!important}

/* Trends — leaderboard */
.trend-row{
  display:flex;align-items:center;gap:10px;padding:6px 6px;
  border-bottom:1px solid var(--line);transition:background .1s;cursor:default;
}
.trend-row:last-child{border-bottom:none}
.trend-row:hover{background:var(--bg2)}
.trend-row .rank{
  width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;
  font-family:var(--mono);font-size:10.5px;color:var(--text3);
  border-radius:50%;background:var(--bg2);
}
.trend-row:nth-child(1) .rank,.trend-row:nth-child(2) .rank,.trend-row:nth-child(3) .rank{color:var(--accent)}
.trend-row .tt{min-width:0;flex:1}
.trend-row .tt b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.trend-row .tt span{font-family:var(--mono);font-size:9.5px;color:var(--text3)}
.trend-row .vol{font-family:var(--mono);font-size:10.5px;color:var(--text2);text-align:right;font-variant-numeric:tabular-nums}
.trend-row .vol small{display:block;font-size:9px;color:var(--text3)}
.momentum{
  font-family:var(--mono);font-weight:500;font-size:10px;display:inline-flex;align-items:center;gap:3px;
  padding:1px 5px;border-radius:var(--radius-sm);border:1px solid;font-variant-numeric:tabular-nums;
}
.momentum.up{color:var(--pos);border-color:rgba(78,154,110,.4)}
.momentum.down{color:var(--neg);border-color:rgba(204,95,82,.4)}
.momentum.flat{color:var(--text3);border-color:var(--line2)}

.predict{border:1px solid var(--line2);padding:12px}
.predict h4{
  font-family:var(--font);font-size:13px;letter-spacing:-.1px;
  color:var(--text);display:flex;align-items:center;gap:7px;margin-bottom:8px;font-weight:600;
}
.predict h4 svg{width:13px;height:13px;color:var(--accent)}
.pred-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.pred-row:last-child{border:none;padding-bottom:0}
.pred-row .kw{font-family:var(--mono);font-size:11px;font-weight:500;flex:0 0 128px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.pred-row .track{flex:1;height:8px;background:var(--bg3);overflow:hidden;border:1px solid var(--line)}
.pred-row .track i{display:block;height:100%;background:var(--accent);opacity:.75;transition:width .6s ease}
.pred-row .pc{font-family:var(--mono);font-size:10.5px;color:var(--accent);width:40px;text-align:right;font-variant-numeric:tabular-nums}
.pred-row .eta{font-family:var(--mono);font-size:9.5px;color:var(--text3);width:84px;text-align:right}

/* Emerging risk signals — early warning demo */
.risk-note{
  font-family:var(--mono);font-size:9px;letter-spacing:.8px;text-transform:uppercase;
  color:var(--text3);margin-bottom:8px;
}
.risk-row{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;background:var(--bg2)}
.risk-row.crit{border-left:2px solid var(--neg)}
.risk-row.high{border-left:2px solid var(--accent)}
.risk-row.mid{border-left:2px solid var(--text3)}
.risk-main{
  display:grid;grid-template-columns:minmax(180px,1.4fr) 120px minmax(90px,.9fr) 1fr auto auto;
  gap:10px;align-items:center;padding:8px 10px;cursor:pointer;
}
.risk-main:hover{background:var(--bg3)}
.risk-main:active{background:var(--bg3)}
.risk-main .rname{font-size:12px;font-weight:600;color:var(--text)}
.risk-main .rvel{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
.prob{display:flex;flex-direction:column;gap:3px}
.prob .pv{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:baseline}
.prob .pv small{font-size:8px;letter-spacing:1px;color:var(--text3);text-transform:uppercase}
.prob .track{height:6px;background:var(--bg3);border:1px solid var(--line);overflow:hidden}
.prob .track i{display:block;height:100%}
.prob.g .pv b{color:var(--pos)} .prob.g .track i{background:var(--pos)}
.prob.a .pv b{color:var(--accent)} .prob.a .track i{background:var(--accent)}
.prob.r .pv b{color:var(--neg)} .prob.r .track i{background:var(--neg)}
.risk-main .rregions{font-family:var(--mono);font-size:9.5px;color:var(--text2);letter-spacing:.4px}
.risk-main .rregions .sep{color:var(--text3)}
.risk-main .rsent{font-family:var(--mono);font-size:9.5px;color:var(--text2)}
.risk-main .rsent em{font-style:normal;color:var(--neg)}
.risk-main .rspark{display:flex;justify-content:flex-end}
.risk-main .caret{color:var(--text3);font-size:9px;transition:transform .15s;font-family:var(--mono)}
.risk-row.open .caret{transform:rotate(90deg);color:var(--accent)}
.risk-detail{display:none;border-top:1px solid var(--line);padding:9px 10px 10px;background:var(--bg1)}
.risk-row.open .risk-detail{display:block;animation:fadeIn .15s ease}
.risk-detail .sig-label{font-family:var(--font);font-size:10.5px;font-weight:600;color:var(--text3);margin-bottom:6px}
.sig-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.sig-tag{
  font-family:var(--mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--text2);border:1px solid var(--line2);border-radius:var(--radius-sm);padding:1.5px 6px;
  background:var(--bg2);
}
.sig-tag.coord{color:var(--neg);border-color:rgba(204,95,82,.5)}
.risk-posts{display:flex;flex-direction:column;gap:6px}
.risk-post{border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;background:var(--bg2)}
.risk-post .rp-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.risk-post .rp-handle{font-family:var(--mono);font-size:10px;color:var(--text)}
.risk-post .rp-meta{font-family:var(--mono);font-size:9px;color:var(--text3)}
.risk-post .rp-emo{margin-left:auto}
.risk-post .rp-text{font-size:11.5px;color:var(--text2);line-height:1.5}
.risk-foot{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-top:8px}

/* Network */
.net-card{padding-bottom:8px}
.net-toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.net-toolbar select{
  background:var(--bg2);color:var(--text);border:1px solid var(--line2);
  border-radius:var(--radius-sm);padding:4px 8px;font-size:11px;font-family:var(--mono);outline:none;cursor:pointer;
}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:var(--radius-sm);
  font-family:var(--mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;
  border:1px solid var(--line2);color:var(--text2);transition:border-color .1s,color .1s,background .1s;
}
.btn:hover{color:var(--text);border-color:var(--text3)}
.btn:active{background:var(--bg3)}
.btn.primary{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.btn.primary:hover{background:rgba(59,91,219,.14)}
.btn.primary:active{background:rgba(59,91,219,.22)}
.btn svg{width:11px;height:11px}
.net-wrap{position:relative;border:1px solid var(--line);background:var(--bg1)}
.net-wrap canvas{display:block;cursor:grab}
.net-wrap canvas:active{cursor:grabbing}
.net-hint{
  position:absolute;left:10px;bottom:8px;font-size:10px;color:var(--text3);
  font-family:var(--mono);letter-spacing:.2px;pointer-events:none;
}
.net-legend{
  position:absolute;right:10px;top:8px;display:flex;flex-direction:column;gap:4px;
  background:rgba(255,255,255,.94);border:1px solid var(--line2);border-radius:var(--radius-sm);
  padding:7px 10px;font-family:var(--font);font-size:10.5px;letter-spacing:.1px;
  color:var(--text2);pointer-events:none;
}
.net-legend span{display:flex;align-items:center;gap:6px}
.net-legend i{width:8px;height:8px}

.detail{
  margin-top:10px;border:1px solid var(--accent-line);
  background:var(--accent-dim);padding:12px;display:none;animation:fadeIn .15s ease;
}
.detail.show{display:block}
.detail .d-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail .dav{
  width:30px;height:30px;border-radius:var(--radius-sm);
  display:grid;place-items:center;font-family:var(--mono);font-weight:600;color:#FFFFFF;font-size:12px;
}
.detail h4{font-family:var(--mono);font-size:13px;font-weight:500}
.detail .d-sub{font-size:9.5px;color:var(--text3);font-family:var(--mono);letter-spacing:.8px;text-transform:uppercase}
.detail .close{
  margin-left:auto;color:var(--text3);width:22px;height:22px;
  display:grid;place-items:center;border:1px solid var(--line2);border-radius:var(--radius-sm);font-size:11px;
}
.detail .close:hover{color:var(--text);border-color:var(--text3)}
.d-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.d-stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px}
.d-stat b{font-family:var(--mono);font-size:14px;font-weight:500;display:block;font-variant-numeric:tabular-nums}
.d-stat span{font-family:var(--mono);font-size:8.5px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.influence-bar{margin-top:10px}
.influence-bar .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.influence-bar .track{height:8px;background:var(--bg3);overflow:hidden;border:1px solid var(--line)}
.influence-bar .track i{display:block;height:100%;background:var(--accent);opacity:.8;transition:width .7s ease}
.follower-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.fchip{
  display:flex;align-items:center;gap:6px;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:2.5px 8px 2.5px 3px;font-size:10.5px;color:var(--text2);cursor:pointer;
  transition:border-color .1s;font-family:var(--mono);
}
.fchip:hover{border-color:var(--accent-line);color:var(--text)}
.fchip i{
  width:14px;height:14px;border-radius:var(--radius-sm);display:grid;place-items:center;
  font-style:normal;font-weight:600;font-size:7.5px;color:#FFFFFF;
}
.fchip b{font-weight:400;color:var(--text3);font-size:9px;font-variant-numeric:tabular-nums}

/* Status table */
.status-grid{display:flex;flex-direction:column;gap:0}
.status-row{display:flex;align-items:center;gap:10px;padding:5.5px 2px;border-bottom:1px solid var(--line)}
.status-row:last-child{border-bottom:none}
.status-row .nm{font-family:var(--mono);font-size:10.5px;width:92px;display:flex;align-items:center;gap:7px;color:var(--text2)}
.status-row .nm svg{width:12px;height:12px}
.status-row .bar{flex:1;height:5px;background:var(--bg3);overflow:hidden;border:1px solid var(--line)}
.status-row .bar i{display:block;height:100%;transition:width .5s ease}
.status-row .st{font-family:var(--mono);font-size:9px;width:76px;text-align:right;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.status-row .lat{font-family:var(--mono);font-size:9.5px;color:var(--text3);width:52px;text-align:right;font-variant-numeric:tabular-nums}

/* States */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--text3);font-size:11px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase}
.loader{width:18px;height:18px;border:1px solid var(--line2);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{position:relative;overflow:hidden;background:var(--bg3);border-radius:var(--radius-sm);animation:pulseDim 1.2s ease infinite}
@keyframes pulseDim{0%,100%{opacity:1}50%{opacity:.55}}
.empty{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:40px 20px;gap:8px;color:var(--text3);
}
.empty .ico{width:36px;height:36px;border:1px dashed var(--line2);display:grid;place-items:center}
.empty .ico svg{width:16px;height:16px;color:var(--text3)}
.empty b{color:var(--text2);font-family:var(--mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase}
.empty p{font-size:11px;max-width:320px}
.empty .btn{margin-top:6px}

/* Toast */
.toast{
  position:fixed;bottom:16px;left:50%;transform:translate(-50%,60px);
  background:var(--bg3);border:1px solid var(--accent-line);border-left:2px solid var(--accent);
  color:var(--text);padding:8px 14px;border-radius:var(--radius);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.4px;
  z-index:200;opacity:0;transition:all .25s ease;
  display:flex;align-items:center;gap:8px;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:12px;height:12px;color:var(--accent)}

/* Time axis note */
.axis-note{
  font-size:10px;color:var(--text3);font-family:var(--mono);
  display:flex;justify-content:space-between;margin-top:6px;letter-spacing:.2px;
}

/* keyboard focus — one consistent ring */
.btn:focus-visible,.nav-item:focus-visible,.ptab:focus-visible,.range button:focus-visible,
.hamburger:focus-visible,.fchip:focus-visible,.detail .close:focus-visible{
  outline:1px solid var(--accent-line);outline-offset:1px;
}

/* ================= Responsive ================= */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .g2,.g23,.g32{grid-template-columns:1fr}
  /* risk rows: wrap the 6-col grid before it overflows */
  .risk-main{grid-template-columns:minmax(150px,1.4fr) 110px 1fr auto auto}
  .risk-main .rsent{display:none}
}
@media (max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:grid}
  .page{padding:12px}
  .topbar{padding:0 12px}
  .range{display:none}
}
@media (max-width:620px){
  .kpis{grid-template-columns:1fr}
  .d-stats{grid-template-columns:repeat(2,1fr)}
  .page-head h1{font-size:16px}
  .live-chip span.txt{display:none}
  .topbar .crumb{display:none}
  /* risk rows: stack metadata under the name */
  .risk-main{grid-template-columns:1fr auto auto;row-gap:6px}
  .risk-main > div:first-child{grid-column:1 / -1}
  .risk-main .rregions{grid-column:1 / 2}
  .risk-main .rspark{grid-column:2 / 3}
  .risk-main .caret{grid-column:3 / 4}
}

.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tier-col{min-width:0}
.tier-col h4{
  font-family:var(--font);font-size:13px;letter-spacing:-.1px;

  border-bottom:1px solid var(--line);padding-bottom:8px;font-weight:600;

.tier-list{display:flex;flex-direction:column}
.tier-row{display:flex;align-items:center;gap:8px;padding:5.5px 0;border-bottom:1px solid var(--line)}
.tier-row:last-child{border-bottom:0}
.tier-row .nm{font-size:12px;color:var(--text);font-weight:500}
.tier-row .st{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--text3)}
@media (max-width:1000px){ .tiers{grid-template-columns:1fr} }

/* --- 3 · "Why this matters" line under page-heads --- */
.page-head p .why{display:block;margin-top:2px;color:var(--text3);font-size:9.5px;letter-spacing:.2px}

/* ============================================================

   Exports: SX.charts.{line, donut, hbars, cloud, sparks}, SX.Network
   ============================================================ */

(function(){
'use strict';

const SX = (window.SX = window.SX || {});
SX.charts = {};
const charts = SX.charts;
const registry = [];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* Auto-refresh all charts on resize (debounced) */
window.addEventListener('resize', ()=>{
  clearTimeout(charts._rt);
  charts._rt = setTimeout(()=>registry.forEach(c=>{ if(c&&c._redraw) c._redraw(); }), 160);
});

/* ---------- shared helpers ---------- */
function hexA(hex, a){
  const h = hex.replace('#','');
  const n = parseInt(h.length===3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function roundRect(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fitCanvas(canvas, wrap, wantH){
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max((wrap||canvas.parentElement).clientWidth, 240);
  const h = wantH || canvas._h || 260;
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  canvas.style.height = h+'px';
  canvas._h = h;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { ctx, w, h };
}
function tipEl(){ return document.getElementById('tip'); }
function showTip(html, x, y){
  const t = tipEl(); if(!t) return;
  t.innerHTML = html; t.style.opacity = 1;
  const r = t.getBoundingClientRect();
  let left = x+14, top = y+14;
  if(left + r.width > window.innerWidth-10)  left = x - r.width - 14;
  if(top  + r.height > window.innerHeight-10) top = y - r.height - 14;
  t.style.left = left+'px'; t.style.top = top+'px';
}
function hideTip(){ const t = tipEl(); if(t) t.style.opacity = 0; }

function niceTicks(min, max, n){
  const span = max-min || 1;
  const step0 = span/Math.max(n,1);
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const norm = step0/mag;
  const step = (norm>=5?10:norm>=2?5:norm>=1?2:1)*mag;
  const start = Math.ceil(min/step)*step;
  const out = [];
  for(let v=start; v<=max+1e-9; v+=step) out.push(v);
  return out;
}
const fmtNum = v => v>=1e6 ? (v/1e6).toFixed(1).replace(/\.0$/,'')+'M' : v>=1e3 ? (v/1e3).toFixed(1).replace(/\.0$/,'')+'K' : String(Math.round(v));
function drawGridY(ctx, x0, x1, y0, y1, maxV){
  const ticks = niceTicks(0, maxV, 4);
  ctx.font = '10px IBM Plex Mono, monospace';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ticks.forEach(v=>{
    const y = y1 - (v/maxV)*(y1-y0);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(43,33,27,.08)';
    ctx.beginPath(); ctx.moveTo(x0, y+.5); ctx.lineTo(x1, y+.5); ctx.stroke();
    ctx.fillStyle = '#6B7686';
    ctx.fillText(fmtNum(v), x0-7, y);
  });
  return maxV;
}

/* ============================================================
   LINE / AREA CHART — multi-series with hover crosshair
   ============================================================ */
charts.line = function(opts){
  const { canvas, dates, series, height=260, yMax, area=true, yFormat='pct' } = opts;
  const wrap = canvas.parentElement;
  let geo = null;

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, wrap, height);
    const padL = yFormat==='none' ? 10 : 38, padR = 12, padT = 12, padB = 22;
    const x0=padL, x1=w-padR, y0=padT, y1=h-padB;
    const n = dates.length;
    const allVals = series.flatMap(s=>s.data);
    const maxV = yMax != null ? yMax : Math.max(...allVals)*1.12;

    if(yFormat!=='none') drawGridY(ctx, x0, x1, y0, y1, maxV);

    /* x labels: first, mid, last, event markers */
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillStyle='#6B7686'; ctx.font='10px IBM Plex Mono, monospace';
    [0, Math.floor((n-1)/2), n-1].forEach(i=>{
      const x = x0 + (i/(n-1))*(x1-x0);
      ctx.fillText(dates[i].slice(5), x, y1+7);
    });

    const X = i => x0 + (n===1?0:(i/(n-1))*(x1-x0));
    const Y = v => y1 - clamp(v/maxV,0,1)*(y1-y0);

    series.forEach(s=>{
      const pts = s.data.map((v,i)=>[X(i), Y(v)]);
      if(area && s.fill!==false){
        ctx.beginPath();
        pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
        ctx.lineTo(pts[pts.length-1][0], y1); ctx.lineTo(pts[0][0], y1); ctx.closePath();
        ctx.fillStyle = hexA(s.color,.07); ctx.fill();
      }
      ctx.beginPath();
      pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
      ctx.strokeStyle = s.color; ctx.lineWidth = s.width||1.6;
      ctx.lineJoin='round'; ctx.lineCap='round';
      if(s.dash) ctx.setLineDash(s.dash); 
      ctx.stroke();
      ctx.setLineDash([]);
    });

    geo = { x0, x1, y0, y1, X, Y, n, maxV };
  }

  canvas.addEventListener('mousemove', e=>{
    if(!geo) return;
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const i = clamp(Math.round(((mx-geo.x0)/(geo.x1-geo.x0))*(geo.n-1)), 0, geo.n-1);
    const cx = geo.X(i);
    const ctx = canvas.getContext('2d');
    draw();
    /* crosshair */
    ctx.strokeStyle='rgba(91,127,212,.45)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx, geo.y0); ctx.lineTo(cx, geo.y1); ctx.stroke();
    series.forEach(s=>{
      const v = s.data[i]; if(v==null) return;
      ctx.beginPath(); ctx.arc(cx, geo.Y(v), 3.5, 0, Math.PI*2);
      ctx.fillStyle = s.color; ctx.fill();
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.5; ctx.stroke();
    });
    const rows = series.map(s=>`<div class="row"><i style="background:${s.color}"></i>${s.name}: <b>${yFormat==='pct'?s.data[i]+'%':fmtNum(s.data[i])}</b></div>`).join('');
    showTip(`<b>${dates[i]}</b>${rows}`, e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseleave', ()=>{ hideTip(); draw(); });

  draw();
  const h = { _redraw: draw, _type:'line' };
  registry.push(h);
  return h;
};

/* ============================================================
   DONUT CHART — with center label & hover
   ============================================================ */
charts.donut = function(opts){
  const { canvas, data, height=240, centerLabel } = opts;
  const wrap = canvas.parentElement;
  let arcs = [];

  function draw(hoverIdx=-1){
    const { ctx, w, h } = fitCanvas(canvas, wrap, height);
    const total = data.reduce((a,d)=>a+d.pct,0);
    const cx=w/2, cy=h/2, R=Math.min(w,h)/2-6, r=R*0.62;
    arcs = [];
    let a0 = -Math.PI/2;
    data.forEach((d,i)=>{
      const a1 = a0 + (d.pct/total)*Math.PI*2;
      const hov = i===hoverIdx;
      const mid = (a0+a1)/2, off = hov?5:0;
      const ccx = cx+Math.cos(mid)*off, ccy = cy+Math.sin(mid)*off;
      ctx.beginPath();
      ctx.arc(ccx,ccy,R,a0+0.008,a1-0.008);
      ctx.arc(ccx,ccy,r,a1-0.008,a0+0.008,true);
      ctx.closePath();
      ctx.fillStyle = hexA(d.color, hov?1:.88);
      ctx.fill();
      if(hov){ ctx.strokeStyle='#1E2A3B'; ctx.lineWidth=1.6; ctx.stroke(); }
      arcs.push({ a0, a1, i });
      a0 = a1;
    });
    /* center */
    ctx.textAlign='center';
    ctx.fillStyle='#1E2A3B'; ctx.font='500 19px IBM Plex Mono, monospace';
    ctx.textBaseline='middle';
    const sel = hoverIdx>=0 ? data[hoverIdx] : null;
    ctx.fillText(sel ? sel.pct+'%' : (centerLabel||total+'%'), cx, cy-6);
    ctx.fillStyle='#6B7686'; ctx.font='500 8.5px IBM Plex Mono, monospace';
    ctx.fillText(sel ? sel.name.toUpperCase() : (centerSub||'ALL SIGNALS'), cx, cy+12);
  }
  let centerSub = opts.centerSub || '';

  canvas.addEventListener('mousemove', e=>{
    const r = canvas.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const ang = Math.atan2(e.clientY-cy, e.clientX-cx);
    let idx=-1;
    arcs.forEach(a=>{ 
      let d = ang - a.a0;
      const span = a.a1-a.a0;
      d = ((d%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      if(d<=span) idx=a.i;
    });
    if(idx!==-1){
      draw(idx);
      const d = data[idx];
      showTip(`<b>${d.name}</b><div class="row"><i style="background:${d.color}"></i>Share: <b>${d.pct}%</b></div>`, e.clientX, e.clientY);
    } else { draw(); hideTip(); }
  });
  canvas.addEventListener('mouseleave', ()=>{ draw(); hideTip(); });

  draw();
  const h = { _redraw: draw, _type:'donut' };
  registry.push(h);
  return h;
};

/* ============================================================
   HORIZONTAL BARS — animated, with value labels
   ============================================================ */
charts.hbars = function(opts){
  const { canvas, data, height, color='#5B7FD4', suffix='%', mono=true } = opts;
  const wrap = canvas.parentElement;
  const H = height || data.length*30+8;
  let progress = 0;

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, wrap, H);
    progress = Math.min(1, progress+0.08);
    const p = 1-Math.pow(1-progress,3);
    const rowH = h/data.length;
    const maxV = Math.max(...data.map(d=>d.pct));
    const maxW = w-56;
    data.forEach((d,i)=>{
      const top = i*rowH;
      /* label above bar (any length) */
      ctx.fillStyle='#3E4C61'; ctx.font='500 10px Inter, sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.fillText(d.label, 0, top+11, maxW-40);
      const by = top+16, bh = rowH-22;
      const bw = (d.pct/maxV)*maxW*p;
      ctx.fillStyle='#EDF0F5';
      roundRect(ctx, 0, by, maxW, bh, 1); ctx.fill();
      ctx.strokeStyle='#D8DDE6'; ctx.lineWidth=1; ctx.stroke(); /* hairline track border, matches .track/.bar */
      ctx.fillStyle = hexA(color,.9);
      roundRect(ctx, 0, by, Math.max(bw,2), bh, 1); ctx.fill();
      ctx.fillStyle='#1E2A3B'; ctx.font=(mono?'500 10px IBM Plex Mono, monospace':'500 10px Inter');
      ctx.textAlign='right'; ctx.textBaseline='alphabetic';
      ctx.fillText(d.pct+suffix, w-2, by+bh-1);
    });
  }
  let frames=0;
  const tick=()=>{ draw(); frames++; if(frames<18) requestAnimationFrame(tick); };
  tick();
  const h = { _redraw: draw, _type:'hbars' };
  registry.push(h);
  return h;
};

/* ============================================================
   SPARKLINE (tiny, no axes)
   ============================================================ */
charts.spark = function(canvas, data, color, area=true){
  const w = canvas.parentElement.clientWidth||110, h = canvas.height||34;
  const dpr = window.devicePixelRatio||1;
  canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+'px'; canvas.style.height=h+'px';
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const max=Math.max(...data), min=Math.min(...data), span=(max-min)||1;
  const X=i=>(i/(data.length-1))*(w-4)+2, Y=v=>h-3-((v-min)/span)*(h-8);
  if(area){
    ctx.beginPath();
    data.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));
    ctx.lineTo(w-2,h); ctx.lineTo(2,h); ctx.closePath(); ctx.fillStyle=hexA(color,.08); ctx.fill();
  }
  ctx.beginPath();
  data.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));
  ctx.strokeStyle=color; ctx.lineWidth=1.5; ctx.lineJoin='round'; ctx.stroke();
  ctx.beginPath(); ctx.arc(X(data.length-1), Y(data[data.length-1]), 2, 0, Math.PI*2);
  ctx.fillStyle=color; ctx.fill();
};

/* ============================================================
   WORD CLOUD — spiral placement, weight-scaled, two-tone
   ============================================================ */
charts.cloud = function(container, words, opts={}){
  const H = opts.height || 240;
  container.innerHTML='';
  const c = document.createElement('canvas');
  container.appendChild(c);
  function draw(){
    const dpr = window.devicePixelRatio||1;
    const W = Math.max(container.clientWidth, 260);
    c.width=W*dpr; c.height=H*dpr; c.style.width=W+'px'; c.style.height=H+'px';
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    const maxS = Math.max(...words.map(w=>w.s)), minS = Math.min(...words.map(w=>w.s));
    const placed = [];
    const palette = opts.colors || ['#5B7FD4','#A9B4C9','#7A8CD8','#4E9A6E','#5B7FD4','#E09A4E'];
    words.forEach((word, idx)=>{
      const t = (word.s-minS)/(maxS-minS||1);
      const size = Math.round(11 + t*24);
      ctx.font = `${t>0.55?600:500} ${size}px Inter, sans-serif`;
      const tw = ctx.measureText(word.w).width;
      let x=W/2, y=H/2, angle = (idx*0.9)%(Math.PI*2);
      let ok=false;
      for(let step=0; step<420 && !ok; step++){
        const rx=(W/2-30)*Math.sqrt(step/420), ry=(H/2-24)*Math.sqrt(step/420);
        x = W/2 + Math.cos(angle)*rx*1.4; y = H/2 + Math.sin(angle)*ry*1.6;
        angle += 0.35;
        ok = placed.every(p=>{
          const px=Math.abs(p.x-x)<(p.w+tw)/2+8, py=Math.abs(p.y-y)<Math.max(p.s,size)*0.72+6;
          return !(px&&py);
        });
        x = clamp(x, tw/2+6, W-tw/2-6); y = clamp(y, size*0.7, H-6);
      }
      if(!ok) return;
      placed.push({x,y,w:tw,s:size});
      const col = t>0.72 ? '#5B7FD4' : palette[idx%palette.length];
      ctx.save();
      ctx.translate(x,y);
      ctx.globalAlpha = 0.55+t*0.45;
      ctx.fillStyle = col;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(word.w, 0, 0);
      ctx.restore();
    });
  }
  draw();
  const h={_redraw:draw,_type:'cloud'};
  registry.push(h);
  return h;
};

/* ============================================================
   COMBO CHART — bars (volume) + overlaid line (sentiment)
   ============================================================ */
charts.combo = function(opts){
  const { canvas, dates, bars, line, height=280, lineMax=10 } = opts;
  const wrap = canvas.parentElement;
  let geo = null;

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, wrap, height);
    const padL=40, padR=40, padT=12, padB=22;
    const x0=padL, x1=w-padR, y0=padT, y1=h-padB;
    const n = dates.length;
    const maxB = Math.max(...bars)*1.15;

    /* left axis = volume */
    drawGridY(ctx, x0, x1, y0, y1, maxB);
    /* right axis = sentiment 0..10 */
    ctx.font='10px IBM Plex Mono, monospace'; ctx.textAlign='left'; ctx.textBaseline='middle';
    [0,2.5,5,7.5,10].forEach(v=>{
      const y = y1-(v/10)*(y1-y0);
      ctx.fillStyle='#6B7686';
      ctx.fillText(v.toFixed(1), x1+6, y);
    });

    /* x labels */
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillStyle='#6B7686';
    [0, Math.floor((n-1)/2), n-1].forEach(i=>{
      const x = x0+(i/(n-1))*(x1-x0);
      ctx.fillText(dates[i].slice(5), x, y1+7);
    });

    const X = i => x0+(i/(n-1))*(x1-x0);
    const slot = (x1-x0)/n;

    /* bars */
    bars.forEach((v,i)=>{
      const bh = (v/maxB)*(y1-y0);
      const bw = Math.min(slot*0.56, 18);
      const bx = X(i)-bw/2;
      ctx.fillStyle='rgba(91,127,212,.34)'; /* muted blue bars */
      roundRect(ctx, bx, y1-bh, bw, bh, 1); ctx.fill();
    });

    /* line */
    const LY = v => y1-(clamp(v/lineMax,0,1))*(y1-y0);
    const pts = line.map((v,i)=>[X(i), LY(v)]);
    ctx.beginPath();
    pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.lineTo(pts[n-1][0],y1); ctx.lineTo(pts[0][0],y1); ctx.closePath();
    ctx.fillStyle=hexA('#5B7FD4',.06); ctx.fill();
    ctx.beginPath();
    pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.strokeStyle='#5B7FD4'; ctx.lineWidth=1.6; ctx.lineJoin='round'; ctx.stroke();
    /* end dot */
    ctx.beginPath(); ctx.arc(pts[n-1][0],pts[n-1][1],3.4,0,Math.PI*2);
    ctx.fillStyle='#5B7FD4'; ctx.fill();

    geo = { x0,x1,y0,y1,X,n,bars,line,dates,LY };
  }

  canvas.addEventListener('mousemove', e=>{
    if(!geo) return;
    const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left;
    const i=clamp(Math.round(((mx-geo.x0)/(geo.x1-geo.x0))*(geo.n-1)),0,geo.n-1);
    const cx=geo.X(i);
    const ctx=canvas.getContext('2d');
    draw();
    ctx.strokeStyle='rgba(91,127,212,.45)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx,geo.y0); ctx.lineTo(cx,geo.y1); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, geo.LY(geo.line[i]), 3.5, 0, Math.PI*2);
    ctx.fillStyle='#5B7FD4'; ctx.fill(); ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=1.5; ctx.stroke();
    showTip(`<b>${geo.dates[i]}</b><div class="row"><i style="background:#7A8CD8"></i>Engagement: <b>${fmtNum(geo.bars[i])}</b></div><div class="row"><i style="background:#5B7FD4"></i>Sentiment: <b>${geo.line[i].toFixed(1)}/10</b></div>`, e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseleave', ()=>{ hideTip(); draw(); });

  draw();
  const hnd={_redraw:draw,_type:'combo'}; registry.push(hnd); return hnd;
};

/* ============================================================
   SCRUBBER CHART — sentiment area + draggable playhead + events
   ============================================================ */
charts.scrubber = function(opts){
  const { canvas, dates, series, events=[], height=230, yMax=100 } = opts;
  const wrap = canvas.parentElement;
  let geo=null, pos=null; /* pos = selected day index */

  function draw(){
    const { ctx, w, h } = fitCanvas(canvas, wrap, height);
    const padL=34, padR=12, padT=10, padB=26;
    const x0=padL,x1=w-padR,y0=padT,y1=h-padB-8;
    const n=dates.length;
    const X=i=>x0+(i/(n-1))*(x1-x0);
    const Y=v=>y1-clamp(v/yMax,0,1)*(y1-y0);

    drawGridY(ctx,x0,x1,y0,y1,yMax);
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillStyle='#6B7686'; ctx.font='10px IBM Plex Mono, monospace';
    [0,Math.floor((n-1)/2),n-1].forEach(i=>ctx.fillText(dates[i].slice(5),X(i),y1+14));

    /* stacked areas: positive / neutral / negative */
    const P = opts.colors || { positive:'#4E9A6E', neutral:'#8894A6', negative:'#CC5F52' };
    const stack = [
      { key:'positive', color:P.positive },
      { key:'neutral',  color:P.neutral },
      { key:'negative', color:P.negative },
    ];
    let base = new Array(n).fill(0);
    stack.forEach(s=>{
      const d = series[s.key];
      const top = d.map((v,i)=>base[i]+v);
      ctx.beginPath();
      top.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));
      for(let i=n-1;i>=0;i--) ctx.lineTo(X(i),Y(base[i]));
      ctx.closePath();
      ctx.fillStyle = hexA(s.color,.28); ctx.fill();
      ctx.beginPath();
      top.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));
      ctx.strokeStyle = hexA(s.color,.85); ctx.lineWidth=1.4; ctx.stroke();
      base = top;
    });

    /* event pins */
    events.forEach(ev=>{
      const i = dates.indexOf(ev.date);
      if(i<0) return;
      const x=X(i), on = pos===i;
      ctx.beginPath(); ctx.moveTo(x,y0+2); ctx.lineTo(x,y1); ctx.setLineDash([3,3]);
      ctx.strokeStyle = on ? 'rgba(91,127,212,.9)' : 'rgba(91,127,212,.35)';
      ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(x,y0+2,on?5:3.6,0,Math.PI*2);
      ctx.fillStyle = on ? '#5B7FD4' : 'rgba(91,127,212,.7)';
      ctx.fill();
    });

    /* playhead */
    if(pos!=null){
      const x=X(pos);
      ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1+6);
      ctx.strokeStyle='#1E2A3B'; ctx.lineWidth=1.4; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-5,y1+6); ctx.lineTo(x+5,y1+6); ctx.lineTo(x,y1+13); ctx.closePath();
      ctx.fillStyle='#1E2A3B'; ctx.fill();
    }
    geo={x0,x1,y0,y1,X,n};
  }

  function pickDay(e){
    if(!geo) return null;
    const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left;
    return clamp(Math.round(((mx-geo.x0)/(geo.x1-geo.x0))*(geo.n-1)),0,geo.n-1);
  }
  canvas.addEventListener('mousemove', e=>{
    if(!geo) return;
    const i=pickDay(e);
    const ctx=canvas.getContext('2d');
    draw();
    const x=geo.X(i);
    ctx.strokeStyle='rgba(43,33,27,.28)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,geo.y0); ctx.lineTo(x,geo.y1); ctx.stroke();
    const ev = events.find(ev=>ev.date===dates[i]);
    showTip(`<b>${dates[i]}${ev?' · EVT: '+ev.title:''}</b>`+
      `<div class="row"><i style="background:#4E9A6E"></i>Positive: <b>${series.positive[i]}%</b></div>`+
      `<div class="row"><i style="background:#7A8CD8"></i>Neutral: <b>${series.neutral[i]}%</b></div>`+
      `<div class="row"><i style="background:#CC5F52"></i>Negative: <b>${series.negative[i]}%</b></div>`, e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseleave', ()=>{ hideTip(); draw(); if(onPick) onPick(pos); });
  canvas.addEventListener('click', e=>{
    const i=pickDay(e);
    pos=i; draw();
    if(onPick) onPick(i);
  });
  let onPick=null;

  draw();
  const hnd={
    _redraw:draw,_type:'scrub',
    setDay(i){ pos=i; draw(); },
    onPick(fn){ onPick=fn; },
    clear(){ pos=null; draw(); },
  };
  registry.push(hnd); return hnd;
};

/* ============================================================
   NETWORK GRAPH — force-directed, interactive, spread animation
   ============================================================ */
SX.Network = function(opts){
  const { canvas, nodes, edges, clusters, onNodeSelect } = opts;
  canvas._h = opts.height || 480;
  const clusterMap = {}; clusters.forEach(c=>clusterMap[c.id]=c);
  const N = nodes.map(n=>({
    ...n,
    x: 0, y: 0, vx: 0, vy: 0,
    r: 8 + (n.influence/100)*16,
    color: clusterMap[n.cluster] ? clusterMap[n.cluster].color : '#3E4C61',
    cls: clusterMap[n.cluster] ? clusterMap[n.cluster].name : 'Other',
  }));
  const E = edges.map(e=>({ a:N.find(n=>n.id===e[0]), b:N.find(n=>n.id===e[1]), w:e[2] })).filter(e=>e.a&&e.b);
  const W = ()=>canvas.parentElement.clientWidth;
  const H = ()=>canvas._h;

  /* size canvas to its container (dpr-aware) */
  function sizeCanvas(){
    const dpr = window.devicePixelRatio||1;
    const w = Math.max(W(), 240);
    canvas.width = Math.round(w*dpr);
    canvas.height = Math.round(H()*dpr);
    canvas.style.width = w+'px';
    canvas.style.height = H()+'px';
  }
  sizeCanvas();
  canvas.style.cursor='default';
  window.addEventListener('resize', ()=>{
    sizeCanvas();
    N.forEach(n=>{ n.x=clamp(n.x, n.r+6, W()-n.r-6); n.y=clamp(n.y, n.r+6, H()-n.r-6); });
  });

  /* init positions in a circle */
  N.forEach((n,i)=>{
    const a = (i/N.length)*Math.PI*2;
    n.x = W()/2 + Math.cos(a)*(W()*0.30);
    n.y = H()/2 + Math.sin(a)*(H()*0.32);
  });

  /* adjacency for spread BFS */
  const adj = {};
  E.forEach(e=>{
    (adj[e.a.id]=adj[e.a.id]||[]).push(e.b.id);
    (adj[e.b.id]=adj[e.b.id]||[]).push(e.a.id);
  });

  let alpha = 1, running = true, hover = null, selected = null;
  let drag = null, dragging = false, moved = 0;
  const spread = { active:false, phase:0, reached:new Set(), front:[] };
  /* per-node diffusion burst rings (1 → 0), fired as each spread wave lands */

  /* ---------- simulation ---------- */
  function step(){
    if(!running) return;
    alpha = Math.max(alpha*0.996, 0.03);
    /* repulsion */
    for(let i=0;i<N.length;i++){
      const a=N[i];
      for(let j=i+1;j<N.length;j++){
        const b=N[j];
        let dx=b.x-a.x, dy=b.y-a.y;
        let d2=dx*dx+dy*dy; if(d2<1) d2=1;
        const f = 2600/d2;
        const d = Math.sqrt(d2);
        dx/=d; dy/=d;
        a.vx-=dx*f; a.vy-=dy*f;
        b.vx+=dx*f; b.vy+=dy*f;
      }
      /* centering */
      a.vx += (W()/2-a.x)*0.0016;
      a.vy += (H()/2-a.y)*0.0018;
    }
    /* spring attraction */
    E.forEach(e=>{
      let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      const target = 130 - e.w*6;
      const f = (d-target)*0.0035*(e.w/9);
      dx/=d; dy/=d;
      e.a.vx+=dx*f*d*0.05; e.a.vy+=dy*f*d*0.05;
      e.b.vx-=dx*f*d*0.05; e.b.vy-=dy*f*d*0.05;
    });
    N.forEach(n=>{
      if(n===drag) return;
      n.vx*=0.86; n.vy*=0.86;
      n.x+=n.vx; n.y+=n.vy;
      n.x = clamp(n.x, n.r+6, W()-n.r-6);
      n.y = clamp(n.y, n.r+6, H()-n.r-6);
    });
  }

  /* ---------- render ---------- */
  function render(){
    const dpr = window.devicePixelRatio||1;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W(),H());

    const dim = n => (selected && selected!==n && !adj[selected.id]?.includes(n.id)) ? 0.13 : 1;

    /* edges */
    E.forEach(e=>{
      const focus = selected && (e.a===selected||e.b===selected);
      ctx.beginPath();
      ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y);
      const g = ctx.createLinearGradient(e.a.x,e.a.y,e.b.x,e.b.y);
      const aCol = hexA(e.a.color, 0.5*dim(e.a)), bCol = hexA(e.b.color, 0.5*dim(e.b));
      g.addColorStop(0,aCol); g.addColorStop(1,bCol);
      ctx.strokeStyle = focus ? 'rgba(91,127,212,.75)' : g;
      ctx.lineWidth = focus ? 2 : 0.6+e.w*0.16;
      ctx.stroke();
      /* spread pulse travelling along edges */
      if(spread.active && spread.reached.has(e.a.id) && !spread.reached.has(e.b.id) ||
         spread.active && spread.reached.has(e.b.id) && !spread.reached.has(e.a.id)){
        const t = (spread.phase%1);
        const reached = spread.reached.has(e.a.id) ? e.a : e.b;
        const other = reached===e.a ? e.b : e.a;
        const px = lerp(reached.x, other.x, t), py = lerp(reached.y, other.y, t);
        ctx.beginPath(); ctx.arc(px, py, 3.2, 0, Math.PI*2);
        ctx.fillStyle='#5B7FD4';
        ctx.fill();
      }
    });

    /* nodes */
    N.forEach(n=>{
      const isSel = n===selected, isHov = n===hover;
      const reach = spread.reached.has(n.id);
      ctx.globalAlpha = reach?1:dim(n);
      if(reach){
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r+6,0,Math.PI*2);
        ctx.fillStyle = hexA('#5B7FD4',.18); ctx.fill();
      }
      /* diffusion burst ring — pulses on the frame the node is newly reached */
      if(n._burst>0){
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r+4+(1-n._burst)*16,0,Math.PI*2);
        ctx.strokeStyle = hexA('#5B7FD4', n._burst*.85);
        ctx.lineWidth = 1.6;
        ctx.stroke();
        n._burst = Math.max(0, n._burst-0.02);
      }
      /* influence halo */
      if(n.influence>=80){
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r+4,0,Math.PI*2);
        ctx.strokeStyle = hexA(n.color,.5); ctx.lineWidth=1.4; ctx.stroke();
      }
      if(n.bridge){
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r+8,0,Math.PI*2);
        ctx.strokeStyle = hexA(n.color,.22); ctx.setLineDash([2,4]); ctx.stroke(); ctx.setLineDash([]);
      }
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=hexA(n.color, .88); ctx.fill();
      if(isSel||isHov){
        ctx.strokeStyle = isSel?'#1E2A3B':'rgba(43,33,27,.5)';
        ctx.lineWidth=1.6; ctx.stroke();
      }
      /* label */
      if(n.influence>=55 || isSel || isHov || reach){
        ctx.globalAlpha = 1;
        ctx.font = (isSel?'700 ':'600 ')+'10.5px Inter, sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.fillStyle = isSel?'#1E2A3B':'rgba(118,104,93,.95)';
        ctx.fillText(n.label, n.x, n.y+n.r+4);
      }
      ctx.globalAlpha=1;
    });
  }

  /* one frame of sim + paint (factored out so it can be driven manually too) */
  function frame(){
    step(); render();
    if(spread.active){
      spread.phase += 0.025;
      /* expand frontier */
      if(spread.phase>=1){
        spread.phase = 0;
        const add = [];
        spread.reached.forEach(id=>{
          (adj[id]||[]).forEach(nb=>{ if(!spread.reached.has(nb)) add.push(nb); });
        });
        add.forEach(id=>spread.reached.add(id));
        add.forEach(id=>{ const n=N.find(x=>x.id===id); if(n) n._burst=1; });
        if(spread.opts && spread.opts.onWave) spread.opts.onWave(spread.reached);
        if(spread.reached.size>=N.length){ spread.active=false; if(spread.opts&&spread.opts.onDone) spread.opts.onDone(); }
      }
    }
  }

  function loop(){
    if(running){
      frame();
    }
    requestAnimationFrame(loop);
  }

  /* ---------- interaction ---------- */
  function pick(mx,my){
    for(let i=N.length-1;i>=0;i--){
      const n=N[i];
      const dx=mx-n.x, dy=my-n.y;
      if(dx*dx+dy*dy < (n.r+6)*(n.r+6)) return n;
    }
    return null;
  }
  canvas.addEventListener('mousemove', e=>{
    const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    if(drag){
      drag.x=mx; drag.y=my; drag.vx=0; drag.vy=0; moved++;
      return;
    }
    hover = pick(mx,my);
    canvas.style.cursor = hover ? 'pointer' : 'grab';
    if(hover){
      showTip(`<b>${hover.label}</b><div class="row"><i style="background:${hover.color}"></i>${hover.cls}</div><div class="row">Influence: <b>${hover.influence}/100</b></div><div class="row">Followers: <b>${fmtNum(hover.followers)}</b></div>${hover.bridge?'<div class="row">Cluster bridge</div>':''}`, e.clientX, e.clientY);
    } else hideTip();
  });
  canvas.addEventListener('mousedown', e=>{
    const r=canvas.getBoundingClientRect();
    const n=pick(e.clientX-r.left, e.clientY-r.top);
    if(n){ drag=n; moved=0; alpha=Math.max(alpha,0.25); canvas.style.cursor='grabbing'; }
  });
  window.addEventListener('mouseup', ()=>{
    if(drag && moved<3){ /* click without drag = select node */
      selected = (selected===drag)?null:drag;
      onNodeSelect && onNodeSelect(selected);
    }
    drag=null;
    canvas.style.cursor='grab';
  });
  canvas.addEventListener('mouseleave', ()=>{ hover=null; hideTip(); canvas.style.cursor='default'; });

  /* ---------- public API ---------- */
  function relayout(){
    alpha=1;
    N.forEach((n,i)=>{
      const a=(i/N.length)*Math.PI*2 + Math.random()*0.6;
      n.x=W()/2+Math.cos(a)*(W()*0.3);
      n.y=H()/2+Math.sin(a)*(H()*0.32);
      n.vx=n.vy=0;
    });
  }
  function startSpread(o){
    const origin = N.find(n=>n.id===(o.origin||'dr_aris'));
    spread.reached = new Set([origin.id]);
    spread.active = true; spread.phase = 0; spread.opts = o;
    origin._burst = 1; /* pulse the patient-zero node */
    if(o.onWave) o.onWave(spread.reached);
  }
  function stopSpread(){ spread.active=false; spread.reached=new Set(); N.forEach(n=>{ n._burst=0; }); }
  function select(id){ selected = id?N.find(n=>n.id===id):null; onNodeSelect && onNodeSelect(selected); }
  function setRunning(v){ running=v; }

  loop();
  const api = { relayout, startSpread, stopSpread, select, setRunning, frame, nodes:N, edges:E };
  canvas._net = api;
  return api;
};

})();

</script>

function mountNetwork(){
  const N = D.network;
  const canvas = document.getElementById('net-canvas');
  const detail = document.getElementById('net-detail');

  const net = SX.Network({
    canvas, nodes:N.nodes, edges:N.edges, clusters:N.clusters, height:500,
    onNodeSelect(n){ renderDetail(n); },
  });

  function renderDetail(n){
    if(!n){ detail.classList.remove('show'); return; }
    const c = N.clusters.find(c=>c.id===n.cluster);
    const conn = net.edges.filter(e=>e.a===n||e.b===n)
      .map(e=> e.a===n?e.b:e.a)
      .sort((a,b)=>b.influence-a.influence);
    detail.innerHTML = `
      <div class="d-head">
        <span class="dav" style="background:${c.color}">${n.label.replace('@','')[0].toUpperCase()}</span>
        <div><h4>${n.label}</h4><span class="d-sub">${c.name}${n.bridge?' · bridge node':''}</span></div>
        <button class="close" id="nd-close" aria-label="Close">✕</button>
      </div>
      <div class="d-stats">
        <div class="d-stat"><b>${n.influence}</b><span>Influence score</span></div>
        <div class="d-stat"><b>${fmt(n.followers)}</b><span>Followers</span></div>
        <div class="d-stat"><b>${conn.length}</b><span>Direct links</span></div>
        <div class="d-stat"><b>${(n.influence*0.83+conn.length*1.4).toFixed(1)}%</b><span>Est. reach factor</span></div>
      </div>
      <div class="influence-bar">
        <div class="lbl"><span>Influence percentile (vs all analyzed accounts)</span><b>Top ${(100-n.influence)}%</b></div>
        <div class="track"><i style="width:${n.influence}%"></i></div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:12px;letter-spacing:.5px">CONNECTED ACCOUNTS</div>
      <div class="follower-chips">
        ${conn.map(m=>`<span class="fchip" data-goto="${m.id}"><i style="background:${N.clusters.find(x=>x.id===m.cluster).color}">${m.label.replace('@','')[0].toUpperCase()}</i>${m.label}<b style="color:var(--text3);font-family:var(--mono);font-size:10px">${m.influence}</b></span>`).join('')||'<span style="color:var(--text3);font-size:12px">Isolated node</span>'}
      </div>`;
    detail.classList.add('show');
    document.getElementById('nd-close').addEventListener('click',()=>{ net.select(null); });
    detail.querySelectorAll('[data-goto]').forEach(ch=>ch.addEventListener('click',()=>net.select(ch.dataset.goto)));
  }

  /* KOL list → select in graph */
  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click',()=>net.select(el.dataset.goto));
  });

  document.getElementById('net-relayout').addEventListener('click',()=>{ net.relayout(); SX.toast('Force layout re-computed'); });
  document.getElementById('net-layout').addEventListener('change', e=>{
    const v = e.target.value;
    net.nodes.forEach(n=>{ n._hide = v!=='all' && n.cluster!==v; });
    SX.toast(v==='all'?'Showing all clusters':'Filtered view (mock highlight)');
  });
}

/* ---------- exports ---------- */
SX.panels = { OverviewPanel, SentimentPanel, DemographicsPanel, TrendsPanel, NetworkPanel, mountOverview, mountSentiment, mountDemographics, mountTrends, mountNetwork };
})();

</script>
<script>
/* ============================================================
   SurviX — App Shell
   Router · sidebar · topbar · platform filter · simulated async
   loading · pipeline ticker · toast
   ============================================================ */

(function(){
'use strict';
const SX = (window.SX = window.SX || {});
const D = window.SURVIX;

const ICONS = {
  logo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 15l5-6 4 4 6-8"/><path d="M14 5h5v5"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 15.2c2.6.3 4.6 1.9 5.3 4.8"/></svg>',
};

/* ---------- routing ---------- */
const ROUTES = [
  { id:'overview',     label:'Overview',       icon:'grid',   tag:null,   render:SX.panels.OverviewPanel,     mount:SX.panels.mountOverview },
  { id:'sentiment',    label:'Sentiment',      icon:'wave',   tag:'AI',   render:SX.panels.SentimentPanel,    mount:SX.panels.mountSentiment },
  { id:'demographics', label:'Demographics',   icon:'users',  tag:null,   render:SX.panels.DemographicsPanel, mount:SX.panels.mountDemographics },
  { id:'trends',       label:'Trends',         icon:'trend',  tag:'LIVE', render:SX.panels.TrendsPanel,       mount:SX.panels.mountTrends },
  { id:'network',      label:'Network',        icon:'net',    tag:'BETA', render:SX.panels.NetworkPanel,      mount:SX.panels.mountNetwork },
];
const NAV_ICONS = {
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 15.2c2.6.3 4.6 1.9 5.3 4.8"/></svg>',
  trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  net:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="12" cy="13" r="2.6"/><circle cx="4.5" cy="18.5" r="2.2"/><circle cx="19.5" cy="18" r="2.2"/><path d="M6.8 7.4l3.4 4M17 6.4l-3.2 5M10.2 14.6l-4 3M13.8 14.8l4 2.4"/></svg>',
};

let currentRoute = 'overview';
let currentPlatform = 'all';

/* ---------- toast ---------- */
SX.toast = function(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>${msg}`;
  t.classList.add('show');
  clearTimeout(SX.toast._t);
  SX.toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
};

/* ---------- shell ---------- */
function shell(){
  document.getElementById('app').innerHTML = `
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="logo">${ICONS.logo}</span>
      <div><div class="brand-name">Survi<b>X</b></div><div class="brand-sub">Audience Intelligence</div></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">Intelligence Modules</div>
      ${ROUTES.map((r,i)=>`
        <button class="nav-item" data-route="${r.id}">
          ${NAV_ICONS[r.icon]}<span>${r.label}</span>
          ${r.tag?`<span class="tag ${r.tag==='BETA'?'beta':''}">${r.tag}</span>`:`<span class="tag">0${i+1}</span>`}
        </button>`).join('')}
    </nav>
    <div class="pipeline-mini">
      <h5>Pipeline <span style="color:var(--accent)">● ${D.pipeline.throughput}</span></h5>
      <div class="pl-meter" title="aggregate ingestion load"><i></i></div>
      ${D.pipeline.rows.map(r=>`
        <div class="pl-row"><span class="dot ${r.state}"></span><span class="nm">${r.name}</span>
        <span class="lat">${r.latency}</span>
        <span class="st" style="color:${r.state==='live'?'var(--pos)':r.state==='syncing'?'var(--accent)':'var(--text3)'}">${r.state}</span></div>`).join('')}
      <div class="pl-row" style="margin-top:6px"><span class="st" style="margin:0;color:var(--text3)">updated ${D.pipeline.updated}</span></div>
      <div class="pl-row"><span class="st" style="margin:0;color:var(--text3)">window 30d · classifier v4.2</span></div>
</div>
    <div class="sidebar-foot">
      <span class="avatar">SM</span><b>MERAJ</b> · PRO
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">${ICONS.menu}</button>
      <div class="crumb" id="crumb">Survi<b>X</b> · Overview</div>
      <div class="topbar-right">
        <div class="live-chip"><span class="dot"></span><span class="txt">LIVE</span><span style="color:var(--text3)" id="clock"></span></div>
        <div class="range" id="platform-range">
          <button class="on" data-pf="all">ALL</button>
          ${['x','telegram','instagram','facebook','reddit','youtube'].map(p=>`<button data-pf="${p}">${D.platforms.find(x=>x.id===p).name.toUpperCase()}</button>`).join('')}
        </div>
      </div>
    </header>
    <div id="page-host" style="display:flex;flex-direction:column;flex:1"></div>
  </main>`;
}

/* ---------- loading / render pipeline ---------- */
function skeleton(){
  return `<div class="page">
    <div class="grid kpis">
      ${'<div class="card kpi"><div class="skeleton" style="height:12px;width:55%"></div><div class="skeleton" style="height:26px;width:40%;margin:10px 0"></div><div class="skeleton" style="height:9px;width:65%"></div></div>'.repeat(4)}
    </div>
    <div class="card" style="margin-top:16px"><div class="skeleton" style="height:290px"></div></div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><div class="skeleton" style="height:180px"></div></div>
      <div class="card"><div class="skeleton" style="height:180px"></div></div>
    </div>
  </div>`;
}

let pageToken = 0;
function navigate(routeId, opts={}){
  const route = ROUTES.find(r=>r.id===routeId) || ROUTES[0];
  currentRoute = route.id;
  const host = document.getElementById('page-host');
  const token = ++pageToken;

  /* nav state */
  document.querySelectorAll('#nav .nav-item[data-route]').forEach(b=>b.classList.toggle('active', b.dataset.route===route.id));
  document.getElementById('crumb').innerHTML = `Survi<b>X</b> · ${route.label}`;
  document.title = `SurviX — ${route.label} · Audience Intelligence`;
  closeMobileSidebar();

  /* simulated async data fetch */
  host.innerHTML = skeleton();
  const delay = opts.fast ? 60 : (420 + Math.random()*480);
  setTimeout(()=>{
    if(token!==pageToken) return; /* stale */
    host.innerHTML = route.render();
    if(location.hash.slice(1)!==route.id) history.replaceState(null,'','#'+route.id);
    try{ route.mount(); }catch(err){ console.error('[SurviX] mount error:', err); }
    /* re-trigger page animation */
    host.firstElementChild && (host.firstElementChild.style.animation='none', void host.firstElementChild.offsetWidth, host.firstElementChild.style.animation='');
  }, delay);
}

/* ---------- topbar platform filter (mock global filter) ---------- */
function bindPlatformFilter(){
  const wrap = document.getElementById('platform-range');
  wrap.addEventListener('click', e=>{
    const b = e.target.closest('button[data-pf]'); if(!b) return;
    wrap.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
    currentPlatform = b.dataset.pf;
    const name = currentPlatform==='all' ? 'All platforms' : D.platforms.find(p=>p.id===currentPlatform).name;
    SX.toast(`Filtered to ${name} — charts refresh with mock data`);
    /* simulated data-dependency: re-render current page */
    navigate(currentRoute, { fast:true });
  });
}

/* ---------- mobile sidebar ---------- */
function closeMobileSidebar(){ document.getElementById('sidebar').classList.remove('open'); }

/* ---------- pipeline ticker (simulated live ingestion) ---------- */
function startPipelineTicker(){
  setInterval(()=>{
    const el = document.querySelector('.pipeline-mini h5 span');
    if(el) el.textContent = '● ' + (1800 + Math.floor(Math.random()*120)) + ' rec/s';
  }, 3000);
}
/* ---------- clock ---------- */
function startClock(){
  const tick = ()=>{ const el=document.getElementById('clock'); if(el) el.textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); };
  tick(); setInterval(tick, 1000);
}

/* ---------- boot ---------- */
function boot(){
  shell();
  document.getElementById('nav').addEventListener('click', e=>{
    const b = e.target.closest('.nav-item[data-route]');
    if(b) navigate(b.dataset.route);
  });
  document.getElementById('hamburger').addEventListener('click', ()=>document.getElementById('sidebar').classList.toggle('open'));
  bindPlatformFilter();
  startPipelineTicker();
  startClock();
  navigate(location.hash.replace('#','')||'overview');
  /* deep links + browser back/forward */
  window.addEventListener('hashchange', ()=>{
    const id = location.hash.replace('#','')||'overview';
    if(id!==currentRoute) navigate(id);
  });
}
document.addEventListener('DOMContentLoaded', boot);

})();

</script>
</body>
</html>
